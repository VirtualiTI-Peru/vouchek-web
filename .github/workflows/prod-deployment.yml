# Deploy Next.js portal to Azure App Service (Production)
# Build in CI and deploy standalone output — do NOT run Oryx npm install on App Service.

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@virtualiti-peru'

      - name: Verify GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Falta el secret NODE_AUTH_TOKEN en este repo."
            echo "Crea un PAT classic con read:packages y guárdalo como Actions secret NODE_AUTH_TOKEN."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            "https://npm.pkg.github.com/@virtualiti-peru/universal-auth")
          if [ "$code" != "200" ]; then
            echo "::error::GitHub Packages respondió HTTP $code con NODE_AUTH_TOKEN."
            echo "El PAT está mal, expiró, o no tiene read:packages."
            exit 1
          fi
          echo "GitHub Packages auth OK (HTTP $code)."

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Build Next.js
        run: npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Prepare standalone package
        run: |
          mkdir -p "${{ runner.temp }}/deploy"
          cp -r .next/standalone/. "${{ runner.temp }}/deploy/"
          mkdir -p "${{ runner.temp }}/deploy/.next/static"
          cp -r .next/static/. "${{ runner.temp }}/deploy/.next/static/"
          if [ -d public ]; then
            mkdir -p "${{ runner.temp }}/deploy/public"
            cp -r public/. "${{ runner.temp }}/deploy/public/"
          fi

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: vouchek
          slot-name: production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PROD }}
          package: ${{ runner.temp }}/deploy
