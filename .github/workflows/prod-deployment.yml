# Deploy Next.js portal to Azure App Service (Production)
# Build in CI so prod does not rely on Oryx/Kudu (SCM_DO_BUILD).

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@virtualiti-peru'

      - name: Verify GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Falta el secret NODE_AUTH_TOKEN en este repo."
            echo "Crea un PAT classic con read:packages, autoriza SSO para VirtualiTI-Peru,"
            echo "y guárdalo como Actions secret NODE_AUTH_TOKEN."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            "https://npm.pkg.github.com/@virtualiti-peru/universal-auth")
          if [ "$code" != "200" ]; then
            echo "::error::GitHub Packages respondió HTTP $code con NODE_AUTH_TOKEN."
            echo "Si es 401: el PAT está mal, expiró, o falta Authorize SSO en VirtualiTI-Peru."
            echo "PAT → https://github.com/settings/tokens → Configure SSO → Authorize VirtualiTI-Peru"
            exit 1
          fi
          echo "GitHub Packages auth OK (HTTP $code)."

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Build Next.js
        run: npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Create deployment package
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: vouchek
          slot-name: production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PROD }}
          package: deploy.zip
